<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found &mdash; The Citation Record</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBFAF7;
    --rule:#DAD6CC;
    --ink:#000000;
    --ink-soft:#4A463E;
    --oxblood:#6B1D2A;
  }

  *{box-sizing:border-box;}

  html{-webkit-text-size-adjust:100%;}

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Spectral',Georgia,serif;
    font-weight:300;
    font-size:19px;
    line-height:1.72;
    -webkit-font-smoothing:antialiased;
  }

  .sheet{
    max-width:44rem;
    margin:0 auto;
    padding:5.5rem 1.75rem 6rem;
  }

  h1{
    font-size:clamp(2.1rem,6.2vw,3.3rem);
    line-height:1.16;
    font-weight:400;
    margin:0;
    letter-spacing:-0.012em;
    color:var(--oxblood);
    padding-bottom:2.75rem;
    border-bottom:1px solid var(--rule);
  }

  p{
    margin:2.75rem 0 0;
    font-size:1.06rem;
    color:var(--ink-soft);
  }

  a{color:var(--oxblood);text-decoration:underline;text-underline-offset:0.18em;text-decoration-thickness:0.06em;}
  a:hover{background:rgba(107,29,42,0.07);}
  a:focus-visible{outline:2px solid var(--oxblood);outline-offset:3px;background:none;}

  @media (max-width:34rem){
    body{font-size:18px;}
    .sheet{padding:3.5rem 1.35rem 4rem;}
  }
</style>
</head>
<body>
<main class="sheet">
  <h1>Not found</h1>
  <p>No page at this address. <a href="/">The Citation Record</a></p>
</main>
</body>
</html>
